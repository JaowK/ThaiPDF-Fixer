<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThaiPDF Fixer - แก้ปัญหาสระลอย</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for JSX -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700;800&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#F8FAFC]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Thai Text Normalization Logic
        const normalizeThaiText = (text) => {
            if (!text) return "";
            let result = text;
            result = result.replace(/[\u200B-\u200D\uFEFF]/g, ''); 
            result = result.replace(/\u00A0/g, ' '); 
            const toneMarks = '[\u0E48-\u0E4B]';
            const upperVowels = '[\u0E31\u0E34-\u0E37\u0E47]';
            const misplacedPattern = new RegExp(`(${toneMarks})(${upperVowels})`, 'g');
            result = result.replace(misplacedPattern, '$2$1');
            result = result.replace(/(\u0E4D)(\u0E48|\u0E49|\u0E4A|\u0E4B)/g, '$1$2'); 
            result = result.replace(/(\u0E48|\u0E49|\u0E4A|\u0E4B)(\u0E4D)/g, '$2$1'); 
            result = result.replace(/([\u0E30-\u0E3A\u0E47-\u0E4E])\1+/g, '$1');
            return result.trim();
        };

        const App = () => {
            const [inputText, setInputText] = useState('');
            const [outputText, setOutputText] = useState('');
            const [isProcessing, setIsProcessing] = useState(false);
            const [mode, setMode] = useState('smart');
            const [copySuccess, setCopySuccess] = useState(false);
            const [error, setError] = useState(null);
            const [history, setHistory] = useState([]);
            const [showHistory, setShowHistory] = useState(false);

            const apiKey = ""; // The environment will provide the key at runtime

            const fetchWithRetry = async (url, options, maxRetries = 5) => {
                let delay = 1000;
                for (let i = 0; i < maxRetries; i++) {
                    try {
                        const response = await fetch(url, options);
                        if (!response.ok) {
                            const errorData = await response.json();
                            throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
                        }
                        return await response.json();
                    } catch (err) {
                        if (i === maxRetries - 1) throw err;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                    }
                }
            };

            const handleFixText = async () => {
                if (!inputText.trim()) return;
                setIsProcessing(true);
                setError(null);

                try {
                    let finalResult = "";
                    if (mode === 'fast') {
                        finalResult = normalizeThaiText(inputText);
                        setOutputText(finalResult);
                    } else {
                        const systemPrompt = "You are a Thai language expert. Reconstruct corrupted Thai PDF text. Return ONLY corrected text.";
                        const data = await fetchWithRetry(
                            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: inputText }] }],
                                    systemInstruction: { parts: [{ text: systemPrompt }] },
                                    generationConfig: { temperature: 0.1, maxOutputTokens: 8000 }
                                })
                            }
                        );

                        finalResult = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                        if (!finalResult) throw new Error("No output received.");
                        setOutputText(finalResult);
                    }

                    const newEntry = {
                        id: Date.now(),
                        timestamp: new Date().toLocaleTimeString(),
                        original: inputText.substring(0, 50) + "...",
                        fixed: finalResult.substring(0, 50) + "...",
                        fullOriginal: inputText,
                        fullFixed: finalResult
                    };
                    setHistory(prev => [newEntry, ...prev].slice(0, 10));

                } catch (err) {
                    setError(err.message || "Failed to process text.");
                    setOutputText(normalizeThaiText(inputText));
                } finally {
                    setIsProcessing(false);
                }
            };

            const copyToClipboard = () => {
                const el = document.createElement('textarea');
                el.value = outputText;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                setCopySuccess(true);
                setTimeout(() => setCopySuccess(false), 2000);
            };

            // Custom Icon Component to handle Lucide in HTML
            const Icon = ({ name, className }) => {
                useEffect(() => {
                    lucide.createIcons();
                }, [name, isProcessing, outputText]);
                return <i data-lucide={name} className={className}></i>;
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-20 backdrop-blur-md bg-white/80">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-2 rounded-xl shadow-lg">
                                    <Icon name="wand-2" className="text-white w-5 h-5" />
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">ThaiPDF Fixer</h1>
                                    <p className="text-[10px] uppercase font-bold text-slate-400">Linguistic Restoration v2.0</p>
                                </div>
                            </div>
                            <button onClick={() => setShowHistory(!showHistory)} className="p-2 rounded-full hover:bg-slate-100 text-slate-400">
                                <Icon name="history" className="w-5 h-5" />
                            </button>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 md:p-8 flex-1 w-full space-y-6">
                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-center gap-4">
                            <div className="flex bg-slate-100 p-1 rounded-xl w-full md:w-auto">
                                <button onClick={() => setMode('smart')} className={`flex-1 md:flex-none flex items-center gap-2 px-6 py-2 rounded-lg text-sm font-bold transition-all ${mode === 'smart' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}`}>
                                    <Icon name="sparkles" className="w-3.5 h-3.5" /> AI Deep Fix
                                </button>
                                <button onClick={() => setMode('fast')} className={`flex-1 md:flex-none flex items-center gap-2 px-6 py-2 rounded-lg text-sm font-bold transition-all ${mode === 'fast' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}`}>
                                    <Icon name="layers" className="w-3.5 h-3.5" /> Quick Rule
                                </button>
                            </div>

                            <div className="flex items-center gap-3 w-full md:w-auto md:ml-auto">
                                <button onClick={() => setInputText('')} className="flex-1 md:flex-none px-4 py-2 text-sm font-bold text-slate-400 hover:text-red-500">
                                    Clear
                                </button>
                                <button 
                                    onClick={handleFixText}
                                    disabled={isProcessing || !inputText}
                                    className={`flex-1 md:flex-none flex items-center justify-center gap-2 px-10 py-2.5 rounded-xl font-bold shadow-lg transition-all ${isProcessing || !inputText ? 'bg-slate-200 text-slate-400' : 'bg-indigo-600 text-white shadow-indigo-100 hover:scale-105'}`}
                                >
                                    {isProcessing ? <Icon name="refresh-ccw" className="w-4 h-4 animate-spin" /> : <Icon name="wand-2" className="w-4 h-4" />}
                                    {isProcessing ? "Fixing..." : "Process Text"}
                                </button>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 h-[calc(100vh-280px)] min-h-[500px]">
                            <div className="flex flex-col gap-3">
                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-2">Input (Corrupted PDF Text)</label>
                                <textarea
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                    placeholder="Paste your broken Thai text here..."
                                    className="flex-1 p-6 bg-white border border-slate-200 rounded-2xl outline-none focus:border-indigo-400 text-lg leading-relaxed text-slate-700"
                                />
                            </div>

                            <div className="flex flex-col gap-3">
                                <div className="flex justify-between items-center px-2">
                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Restored Output</label>
                                    {outputText && (
                                        <button onClick={copyToClipboard} className={`flex items-center gap-1 text-[10px] font-bold ${copySuccess ? 'text-green-600' : 'text-indigo-600'}`}>
                                            <Icon name={copySuccess ? "check" : "copy"} className="w-3 h-3" /> {copySuccess ? "Copied" : "Copy All"}
                                        </button>
                                    )}
                                </div>
                                <div className="flex-1 relative group">
                                    <div className={`w-full h-full p-6 bg-slate-900 rounded-2xl border border-slate-800 text-lg leading-relaxed overflow-auto scrollbar-thin ${isProcessing ? 'opacity-40' : ''}`}>
                                        {outputText ? <p className="text-indigo-50 whitespace-pre-wrap">{outputText}</p> : <div className="h-full flex items-center justify-center text-slate-700"><p className="text-xs font-bold uppercase tracking-widest opacity-30">Waiting for processing</p></div>}
                                    </div>
                                    {isProcessing && (
                                        <div className="absolute inset-0 flex items-center justify-center">
                                            <div className="bg-white/90 p-8 rounded-3xl shadow-2xl flex flex-col items-center gap-4">
                                                <div className="w-12 h-12 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div>
                                                <p className="text-sm font-black text-slate-800 uppercase tracking-tight">AI Engine Processing</p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>

                    {showHistory && (
                        <div className="fixed inset-0 z-50 flex justify-end">
                            <div className="absolute inset-0 bg-slate-900/40" onClick={() => setShowHistory(false)} />
                            <div className="relative w-full max-w-md bg-white h-full shadow-2xl flex flex-col p-6 overflow-auto">
                                <div className="flex justify-between mb-6">
                                    <h3 className="font-bold flex items-center gap-2"><Icon name="history" className="w-5 h-5" /> Recent Fixes</h3>
                                    <button onClick={() => setShowHistory(false)}>Close</button>
                                </div>
                                {history.length === 0 ? <p className="text-center text-slate-400 py-10">No history</p> : history.map(item => (
                                    <button key={item.id} onClick={() => { setInputText(item.fullOriginal); setOutputText(item.fullFixed); setShowHistory(false); }} className="w-full text-left p-4 border rounded-xl mb-3 hover:bg-slate-50">
                                        <div className="text-[10px] text-slate-400">{item.timestamp}</div>
                                        <div className="text-sm font-bold truncate">{item.fixed}</div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {error && (
                        <div className="fixed bottom-6 right-6 bg-red-600 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-4 z-50">
                            <Icon name="alert-circle" className="w-5 h-5" />
                            <span className="text-xs font-bold">{error}</span>
                            <button onClick={() => setError(null)} className="ml-2">×</button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
